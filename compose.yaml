name: photographer-fes

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photographer_fes}
      POSTGRES_USER: ${POSTGRES_USER:-photographer_fes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.docker.example to .env.docker and set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb

  app:
    profiles: ["app"]
    build:
      context: .
      target: development
    command: >-
      sh -c "pnpm admin:migrate && pnpm dev --hostname 0.0.0.0 --port 3000"
    environment:
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-photographer_fes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-photographer_fes}
      ADMIN_DATABASE_POOL_MAX: ${ADMIN_DATABASE_POOL_MAX:-10}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-replace-with-sanity-project-id}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-2026-07-11}
      SANITY_API_READ_TOKEN: ${SANITY_API_READ_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    profiles: ["tools"]
    image: adminer:5.4.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
